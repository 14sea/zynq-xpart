# EBAZ4205 OpenOCD top-level config
#
# Hardware:
#   SoC:     Xilinx XC7Z010-1CLG400I (Zynq-7010)
#   JTAG:    via 14-pin header J8 on main board
#   Adapter: Digilent HS3 (FT232H, USB 0403:6014)
#
# Usage:
#   openocd -f ebaz4205.cfg                  # interactive (telnet :4444)
#   openocd -f ebaz4205.cfg -c "init; scan_chain; exit"   # smoke test
#   openocd -f ebaz4205.cfg -c "init; pld load 0 my.bit; exit"

source [find interface/ftdi/digilent_jtag_hs3.cfg]

# zynq_7000.cfg sets adapter speed to 1 MHz; override after sourcing.
# HS3 supports up to 30 MHz; 5 MHz is a safe starting point with flying leads.
source [find target/zynq_7000.cfg]
adapter speed 5000

# HS3 only drives nSRST; PS_POR_B is left to the on-board reset controller.
reset_config srst_only srst_push_pull
